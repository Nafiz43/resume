name: Build resume PDF

on:
  push:
    branches: [main]
    paths-ignore:
      - "Nafiz_Imtiaz_Khan_Resume.pdf"
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"   # weekly (Mon 09:00 UTC), after the portfolio's nightly ORCID sync

concurrency:
  group: build-resume
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Small local model rates each paper's relevance to the rest of the resume (no API key).
      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve >/dev/null 2>&1 &)
          for i in $(seq 30); do ollama list >/dev/null 2>&1 && break; sleep 1; done
          ollama pull all-minilm

      # Publications come from the website's ORCID-synced list (Nafiz43/portfolio), ranked by
      # freshness + first authorship + relevance, then trimmed until the resume fits 2 pages.
      - name: Regenerate publications.tex and compile
        run: |
          TEX="docker run --rm -u $(id -u):$(id -g) -e HOME=/tmp -v $PWD:/w -w /w ghcr.io/xu-cheng/texlive-full:latest"
          docker pull -q ghcr.io/xu-cheng/texlive-full:latest
          LATEX_CMD="$TEX pdflatex -interaction=nonstopmode 01-main.tex" python3 tools/pubs_to_tex.py
          $TEX latexmk -pdf -interaction=nonstopmode 01-main.tex
          mv -f 01-main.pdf Nafiz_Imtiaz_Khan_Resume.pdf

      - name: Commit compiled PDF
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild resume PDF [skip ci]"
          file_pattern: Nafiz_Imtiaz_Khan_Resume.pdf publications.tex

      - name: Purge jsDelivr CDN cache
        if: steps.commit.outputs.changes_detected == 'true'
        run: |
          curl -fsSL "https://purge.jsdelivr.net/gh/Nafiz43/resume@main/Nafiz_Imtiaz_Khan_Resume.pdf"
